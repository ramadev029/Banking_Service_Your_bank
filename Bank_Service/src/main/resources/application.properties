# Application Name & Port
spring.application.name=Bank_Service
server.port=${SERVER_PORT:8085}

# Import local .env file if present
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking_service}
spring.datasource.username=${DB_USERNAME:banking_app}
spring.datasource.password=${DB_PASSWORD:admin6162}
spring.datasource.driver-class-name=org.postgresql.Driver

# Security JWT Secret Key Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Razorpay Payment Gateway Configuration
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_YourBankKey123}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:YourBankSecretKey123}

# AI Triage Assistant Configuration
app.triage.gemini-api-key=${GEMINI_API_KEY:}
app.triage.flakiness-threshold-percent=25.0

# Jira REST API Integration Configuration
jira.url=${JIRA_URL:https://ramadev-bank.atlassian.net}
jira.username=${JIRA_USERNAME:ramadev029@gmail.com}
jira.api-token=${JIRA_API_TOKEN:}
jira.project-key=${JIRA_PROJECT_KEY:KAN}
